<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f7f5"><title>Daily RSS · 每日情报</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap');
:root{--bg:#f6f7f5;--paper:#fff;--ink:#20241f;--muted:#858b82;--line:#e8ebe6;--green:#466a51;--mint:#e8f0e9;--orange:#dc744e;--shadow:0 12px 36px #2634280b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans','Noto Sans SC',sans-serif;font-size:14px}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:246px minmax(0,1fr)}aside{border-right:1px solid var(--line);padding:30px 20px;display:flex;flex-direction:column;gap:32px;background:#fafbf9}.brand{display:flex;align-items:center;gap:11px;padding:0 8px}.brand-mark{width:34px;height:34px;background:var(--green);border-radius:11px;display:grid;place-items:center;color:#fff;font-size:17px}.brand-name{font-weight:700;letter-spacing:-.4px;font-size:17px}.brand-sub{font:9px 'DM Mono',monospace;color:var(--muted);letter-spacing:1px;margin-top:3px}.nav-label{font:10px 'DM Mono',monospace;color:#a1a79f;letter-spacing:1.6px;padding:0 10px 9px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#727970;text-align:left;padding:11px 12px;border-radius:9px;display:flex;align-items:center;gap:12px;font-size:13px}.nav button:hover,.nav button.active{background:var(--mint);color:var(--green);font-weight:600}.nav .icon{width:16px;text-align:center;font-size:15px}.count{margin-left:auto;font:10px 'DM Mono',monospace;color:#8f968d}.feed-heading{display:flex;justify-content:space-between;align-items:center}.add-feed{border:0;background:none;color:var(--green);font-size:20px;line-height:1}.feed-list{max-height:38vh;overflow:auto;display:grid;gap:3px}.feed-item{border:0;background:none;text-align:left;padding:8px 10px;color:#727970;border-radius:8px;font-size:12px;display:flex;gap:8px;align-items:center}.feed-item:hover{background:#eff2ed;color:var(--ink)}.feed-dot{width:6px;height:6px;border-radius:50%;background:#a9b9a7;flex:none}.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:18px 8px 0;color:var(--muted);font-size:11px;line-height:1.7}.status{display:flex;align-items:center;gap:7px}.status i{width:7px;height:7px;background:#68a874;border-radius:50%}main{min-width:0;padding:31px clamp(22px,5vw,76px) 60px;max-width:1500px;width:100%;margin:0 auto}.topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:37px}.crumb{font:10px 'DM Mono',monospace;letter-spacing:1.4px;color:#9da39a;text-transform:uppercase}.top-actions{display:flex;gap:9px}.btn{border:1px solid var(--line);border-radius:8px;background:#fff;padding:9px 13px;color:#555e53;font-size:12px;transition:.15s}.btn:hover{border-color:#b6c4b5;color:var(--green)}.btn.primary{background:var(--green);color:white;border-color:var(--green)}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:27px}.eyebrow{font:10px 'DM Mono',monospace;letter-spacing:1.8px;color:var(--orange);text-transform:uppercase;margin-bottom:9px}.hero h1{font-size:35px;letter-spacing:-1.5px;margin:0;font-weight:600}.hero p{margin:8px 0 0;color:var(--muted);font-size:13px}.date-stamp{text-align:right;font:11px 'DM Mono',monospace;color:#8d958a;line-height:1.8}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 28px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:15px 18px}.stat-label{color:var(--muted);font-size:11px}.stat-value{font-size:23px;font-weight:600;margin-top:7px;letter-spacing:-.7px}.stat-value small{font-size:11px;color:#8d958a;font-weight:400;letter-spacing:0;margin-left:4px}.toolbar{display:flex;align-items:center;gap:9px;margin-bottom:16px;flex-wrap:wrap}.search{position:relative;flex:1;min-width:190px}.search input{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 12px 0 35px;outline:none;color:var(--ink)}.search input:focus,.toolbar select:focus{border-color:#9bb39d}.search span{position:absolute;left:12px;top:10px;color:#a2a79f}.toolbar select,.toolbar input[type=date]{height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#626a60;padding:0 10px;outline:none;font-size:12px}.tabs{display:flex;gap:19px;border-bottom:1px solid var(--line);margin-bottom:18px}.tab{border:0;background:none;padding:0 1px 12px;color:#8b9188;font-size:12px;position:relative}.tab.active{color:var(--green);font-weight:600}.tab.active:after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--green)}.article-list{display:grid;gap:10px}.article{background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px 19px;transition:.18s;box-shadow:0 2px 6px #26342803}.article:hover{box-shadow:var(--shadow);border-color:#dbe2d9;transform:translateY(-1px)}.article.read{opacity:.68}.article-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.article-title{font-size:15px;line-height:1.55;font-weight:600;color:#2d332c;text-decoration:none}.article-title:hover{color:var(--green)}.article-meta{display:flex;align-items:center;gap:8px;color:#9a9f97;font:10px 'DM Mono',monospace;white-space:nowrap;margin-top:4px}.tag{background:#f0f3ef;color:#788778;font:10px 'Noto Sans SC',sans-serif;padding:3px 7px;border-radius:5px}.article-summary{color:#7b8279;line-height:1.7;font-size:12px;margin:10px 0 0;max-width:900px}.article-footer{display:flex;align-items:center;justify-content:space-between;margin-top:13px}.article-actions{display:flex;gap:7px}.icon-btn{border:1px solid transparent;background:transparent;border-radius:6px;color:#969d94;padding:5px 8px;font-size:11px}.icon-btn:hover{background:#f3f5f2;color:var(--green)}.icon-btn.on{color:var(--orange)}.empty{padding:55px 20px;text-align:center;color:#92988f;border:1px dashed #dce1da;border-radius:12px;background:#fbfcfa}.empty b{display:block;color:#525c51;margin-bottom:7px}.briefing{white-space:pre-wrap;line-height:1.9;color:#586054;font-size:13px}.overlay{position:fixed;inset:0;background:#1a211b77;display:grid;place-items:center;padding:20px;z-index:5}.modal{width:min(440px,100%);background:#fff;border-radius:15px;padding:24px;box-shadow:0 25px 80px #15211933}.modal h2{margin:0 0 18px;font-size:19px}.modal label{display:block;font-size:11px;color:#727a70;margin:12px 0 6px}.modal input,.modal select{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;padding:0 10px;outline:none}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#26382b;color:white;padding:11px 17px;border-radius:9px;box-shadow:var(--shadow);z-index:10;font-size:12px}.spinner{display:inline-block;width:12px;height:12px;border:2px solid #ffffff66;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:780px){.app{grid-template-columns:1fr}aside{padding:14px 16px;border-right:0;border-bottom:1px solid var(--line);gap:13px}.brand{padding:0 2px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px}.nav-label,.feed-list,.feed-heading,.side-foot{display:none}main{padding:22px 16px 45px}.topline{margin-bottom:25px}.hero h1{font-size:29px}.stats{gap:7px}.stat{padding:12px}.stat-value{font-size:20px}.date-stamp{font-size:9px}.article{padding:14px}.article-top{display:block}.article-meta{margin-top:7px}.toolbar select,.toolbar input[type=date]{min-width:0;flex:1}}
</style></head>
<body><div class="app"><aside><div class="brand"><div class="brand-mark">◒</div><div><div class="brand-name">Daily RSS</div><div class="brand-sub">YOUR DAILY SIGNAL</div></div></div><section><div class="nav-label">工作台</div><nav class="nav" id="nav"><button class="active" data-view="all"><span class="icon">◷</span>全部资讯 <span class="count" id="allCount">—</span></button><button data-view="unread"><span class="icon">◉</span>未读</button><button data-view="favorites"><span class="icon">☆</span>我的收藏</button><button data-view="briefing"><span class="icon">✳</span>每日简报</button></nav></section><section><div class="feed-heading"><div class="nav-label">订阅来��</div><button class="add-feed" id="addFeed" title="添加 RSS 来源">＋</button></div><div class="feed-list" id="feedList"></div></section><div class="side-foot"><div class="status"><i></i><span>RSS 聚合服务运行中</span></div><div style="margin-top:8px">多源聚合 · 自动去重<br>每 15 分钟同步一次</div></div></aside>
<main><div class="topline"><div class="crumb">INTELLIGENCE / <span id="crumbView">ALL STORIES</span></div><div class="top-actions"><button class="btn" id="refreshBtn">↻ &nbsp;同步来源</button><button class="btn primary" id="briefTop">✳ &nbsp;生成简报</button></div></div><section class="hero"><div><div class="eyebrow">YOUR DAILY SIGNAL</div><h1 id="pageTitle">今日资讯</h1><p id="pageSub">跨越信息噪音，读懂真正重要的事。</p></div><div class="date-stamp" id="todayStamp"></div></section><section class="stats"><div class="stat"><div class="stat-label">收录文章</div><div class="stat-value" id="statTotal">— <small>篇</small></div></div><div class="stat"><div class="stat-label">订阅来源</div><div class="stat-value" id="statFeeds">— <small>个</small></div></div><div class="stat"><div class="stat-label">未读资讯</div><div class="stat-value" id="statUnread">— <small>篇</small></div></div></section><div id="feedNotice" style="display:none;background:#fff7e8;border:1px solid #f1e2c4;border-radius:9px;padding:11px 14px;color:#88714c;font-size:12px;margin-bottom:17px">还没有文章。可点击「同步来源」立即获取，部分 RSS 站点可能需要稍后重试。</div><div class="toolbar" id="toolbar"><div class="search"><span>⌕</span><input id="search" placeholder="搜索标题、内容或来源…"></div><input id="dateFrom" type="date" aria-label="开始日期"><input id="dateTo" type="date" aria-label="结束日期"><select id="feedFilter"><option value="">所有来源</option></select></div><div class="tabs" id="tabs"><button class="tab active" data-range="all">全部时间</button><button class="tab" data-range="today">今天</button><button class="tab" data-range="week">最近 7 天</button></div><section class="article-list" id="articles"></section></main></div><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const $=s=>document.querySelector(s);let view='all',range='all',feeds=[],articles=[],searchTimer;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateText=v=>{if(!v)return '日期未知';const d=new Date(v);return isNaN(d)?'日期未知':d.toLocaleDateString('zh-CN',{month:'short',day:'numeric'})};
function toast(msg){const root=$('#toastRoot');root.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>root.innerHTML='',3000)}
async function api(url,opts={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opts});const data=r.status===204?null:await r.json().catch(()=>({}));if(!r.ok)throw Error(data?.error||`请求失败 (${r.status})`);return data}
function params(){const p=new URLSearchParams(),q=$('#search').value.trim();if(q)p.set('q',q);const feed=$('#feedFilter').value;if(feed)p.set('feed',feed);if(view==='unread')p.set('unread','1');if(view==='favorites')p.set('favorite','1');let from=$('#dateFrom').value,to=$('#dateTo').value;if(range==='today'&&!from){from=new Date().toISOString().slice(0,10);to=from}if(range==='week'&&!from){const d=new Date();d.setDate(d.getDate()-6);from=d.toISOString().slice(0,10)}if(from)p.set('from',from);if(to)p.set('to',to);p.set('limit','100');return p}
async function load(){try{const [f,a]=await Promise.all([api('/api/feeds'),api('/api/articles?'+params())]);feeds=f;articles=a;render()}catch(e){toast(e.message)}}
function render(){const total=articles.length,unread=articles.filter(a=>!a.is_read).length;$('#allCount').textContent=total;$('#statTotal').innerHTML=`${total}<small>篇</small>`;$('#statFeeds').innerHTML=`${feeds.length}<small>个</small>`;$('#statUnread').innerHTML=`${unread}<small>篇</small>`;$('#feedNotice').style.display=total?'none':'block';$('#feedList').innerHTML=feeds.map(f=>`<button class="feed-item" data-feed="${f.id}"><i class="feed-dot"></i><span>${esc(f.title)}</span></button>`).join('');const select=$('#feedFilter'),old=select.value;select.innerHTML='<option value="">所有来源</option>'+feeds.map(f=>`<option value="${f.id}">${esc(f.title)}</option>`).join('');select.value=old;const list=$('#articles');if(view==='briefing'){list.innerHTML='<div class="empty"><b>生成一份今日简报</b>AI 将根据最近 24 小时的资讯，整理主题、趋势和优先阅读内容。<div style="margin-top:16px"><button class="btn primary" id="briefInline">✳ 生成每日简报</button></div></div>';$('#briefInline').onclick=makeBriefing;return}if(!total){list.innerHTML='<div class="empty"><b>这里暂时安静</b>调整筛选条件，或同步 RSS 来源获取最新资讯。</div>';return}list.innerHTML=articles.map(a=>`<article class="article ${a.is_read?'read':''}" data-id="${a.id}"><div class="article-top"><a class="article-title" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">${esc(a.title)}</a><div class="article-meta"><span>${esc(dateText(a.published_at))}</span></div></div><div class="article-meta" style="margin-top:8px"><span class="tag">${esc(a.category||'综合')}</span><span>${esc(a.feed_title)}</span>${a.author?`<span>· ${esc(a.author)}</span>`:''}</div>${a.ai_summary?`<p class="article-summary"><b style="color:#466a51">AI 摘要：</b>${esc(a.ai_summary)}</p>`:(a.summary?`<p class="article-summary">${esc(a.summary.slice(0,280))}${a.summary.length>280?'…':''}</p>`:'')}<div class="article-footer"><span class="article-meta">${a.is_read?'已读':'未读'}</span><div class="article-actions"><button class="icon-btn ${a.is_favorite?'on':''}" data-action="favorite">${a.is_favorite?'★':'☆'} ${a.is_favorite?'已收藏':'收藏'}</button><button class="icon-btn" data-action="summary">✳ AI 摘要</button><button class="icon-btn" data-action="read">${a.is_read?'标为未读':'标为已读'}</button></div></div></article>`).join('')}
function setView(v){view=v;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));const titles={all:['今日资讯','跨越信息噪音，读懂真正重要的事。','ALL STORIES'],unread:['未读资讯','稍后再看，重要内容不会错过。','UNREAD'],favorites:['我的收藏','值得反复阅读的内容，都在这里。','SAVED'],briefing:['每日简报','用几分钟，掌握过去 24 小时的重要动态。','DAILY BRIEF']};$('#pageTitle').textContent=titles[v][0];$('#pageSub').textContent=titles[v][1];$('#crumbView').textContent=titles[v][2];$('#toolbar').style.display=v==='briefing'?'none':'flex';$('#tabs').style.display=v==='briefing'?'none':'flex';load()}
async function mutate(id,body){try{await api(`/api/articles/${id}/state`,{method:'PATCH',body:JSON.stringify(body)});await load()}catch(e){toast(e.message)}}
async function refresh(){const b=$('#refreshBtn');b.disabled=true;b.innerHTML='<i class="spinner"></i>正在同步';try{const result=await api('/api/refresh',{method:'POST'}),bad=result.results.filter(x=>!x.ok).length;toast(bad?`同步完成，${bad} 个来源暂时不可用`:'同步完成，资讯已更新');await load()}catch(e){toast(e.message)}finally{b.disabled=false;b.innerHTML='↻ &nbsp;同步来源'}}
async function makeBriefing(){const list=$('#articles');list.innerHTML='<div class="empty"><span class="spinner" style="border-color:#aaa;border-top-color:#466a51"></span>正在整理最近 24 小时的资讯…</div>';try{const d=await api('/api/briefing',{method:'POST'});list.innerHTML=`<article class="article"><div class="eyebrow">AI DAILY BRIEF · ${esc(dateText(d.generatedAt))}</div><div class="briefing">${esc(d.briefing)}</div><p class="article-meta">基于 ${d.articleCount} 篇近期文章生成 · AI 内容仅供参考</p></article>`}catch(e){list.innerHTML=`<div class="empty"><b>暂时无法生成简报</b>${esc(e.message)}<div style="margin-top:14px"><button class="btn" onclick="load()">返回资讯流</button></div></div>`}}
function showFeedModal(){$('#modalRoot').innerHTML=`<div class="overlay" id="overlay"><form class="modal" id="feedForm"><h2>添加 RSS 来源</h2><label>订阅名称</label><input name="title" placeholder="例如：AI 科技日报"><label>RSS 地址</label><input name="url" type="url" required placeholder="https://example.com/feed.xml"><label>领域分类</label><select name="category"><option>AI</option><option>开发</option><option>开源</option><option>研究</option><option>行业</option><option>综合</option></select><div class="modal-actions"><button type="button" class="btn" id="cancelModal">取消</button><button class="btn primary">添加来源</button></div></form></div>`;$('#cancelModal').onclick=()=>$('#modalRoot').innerHTML='';$('#overlay').onclick=e=>{if(e.target.id==='overlay')$('#modalRoot').innerHTML=''};$('#feedForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/feeds',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});$('#modalRoot').innerHTML='';toast('来源已添加');await load()}catch(err){toast(err.message)}}}
$('#nav').onclick=e=>{const b=e.target.closest('[data-view]');if(b)setView(b.dataset.view)};$('#addFeed').onclick=showFeedModal;$('#refreshBtn').onclick=refresh;$('#briefTop').onclick=()=>{setView('briefing');setTimeout(makeBriefing,0)};$('#search').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(load,250)};$('#feedFilter').onchange=load;$('#dateFrom').onchange=()=>{range='custom';document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));load()};$('#dateTo').onchange=()=>{range='custom';document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));load()};$('#tabs').onclick=e=>{const b=e.target.closest('[data-range]');if(!b)return;range=b.dataset.range;$('#dateFrom').value='';$('#dateTo').value='';document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===b));load()};$('#articles').onclick=async e=>{const card=e.target.closest('.article');if(!card)return;const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;const a=articles.find(x=>x.id===card.dataset.id);if(action==='read')mutate(a.id,{is_read:!a.is_read});if(action==='favorite')mutate(a.id,{is_favorite:!a.is_favorite});if(action==='summary'){const btn=e.target.closest('button');btn.disabled=true;btn.textContent='生成中…';try{await api(`/api/articles/${a.id}/summarize`,{method:'POST'});toast('AI 摘要已生成');await load()}catch(err){toast(err.message);btn.disabled=false;btn.textContent='✳ AI 摘要'}}};$('#feedList').onclick=e=>{const b=e.target.closest('[data-feed]');if(!b)return;$('#feedFilter').value=b.dataset.feed;view='all';document.querySelectorAll('#nav button').forEach(n=>n.classList.toggle('active',n.dataset.view==='all'));load()};$('#todayStamp').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).toUpperCase();load();
</script></body></html>
